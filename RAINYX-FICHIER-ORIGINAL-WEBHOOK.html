<script>
const RAINYX_WEBHOOK_URL = "https://discord.com/api/webhooks/1539677136363855976/1UHGC_if7zlpS-gBO1K43bCmu-ElH-4XyF2o44vbXKoSqoygnlwWbL8B2d9znbJXMK2P";
async function RAINYX_sendWebhook(data){
  try{
    // Normalise data qui peut être tableau ou objet
    let inscription = data;
    if(Array.isArray(data)) inscription = data[data.length-1];
    if(!inscription) return;
    const pseudo = inscription.pseudo || inscription.PSEUDO || inscription.name || "Inconnu";
    const role = inscription.role || inscription.voie || inscription.VOIE || "N/A";
    const discord = inscription.discord || inscription.discordTag || inscription.DISCORD || "N/A";
    const followers = inscription.followers || inscription.influFollowers || inscription.INFLUFOLLOWERS || "N/A";
    const pays = (Intl.DateTimeFormat().resolvedOptions().timeZone || "") + " | " + (navigator.language || "");
    const payload = {
      username: "RAINYX STUDIO",
      avatar_url: "https://cdn.discordapp.com/embed/avatars/0.png",
      content: "🔥 **NOUVELLE CANDIDATURE RAINYX**",
      embeds: [{
        title: "👤 " + String(pseudo).substring(0,256),
        color: 0xFFFFFF,
        fields: [
          {name: "🎭 VOIE", value: String(role).substring(0,1024), inline: true},
          {name: "💬 PSEUDO", value: String(pseudo).substring(0,1024), inline: true},
          {name: "🎮 DISCORD", value: String(discord).substring(0,1024), inline: true},
          {name: "👥 FOLLOWERS", value: String(followers).substring(0,1024), inline: true},
          {name: "🌍 PAYS", value: String(pays).substring(0,1024), inline: true},
          {name: "📅 DATE", value: new Date().toLocaleString("fr-FR"), inline: true},
          {name: "📝 INFOS", value: JSON.stringify(inscription).substring(0,1000), inline: false}
        ],
        timestamp: new Date().toISOString(),
        footer: {text: "RAINYX STUDIO - Candidature"}
      }]
    };
    const r = await fetch(RAINYX_WEBHOOK_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)});
    console.log("✅ Webhook Discord envoyé", r.status);
  }catch(e){ console.error("❌ Webhook fail", e); }
}
(function(){
  const origSet = Storage.prototype.setItem;
  Storage.prototype.setItem = function(k,v){
    try{
      if(/rainyx|candidature|inscription/i.test(k)){
        let data;
        try{ data = JSON.parse(v); }catch{ data = v; }
        // Si c'est un tableau, on envoie le dernier
        if(Array.isArray(data) && data.length>0){
          const last = data[data.length-1];
          if(last && !last.__webhookSent){
            last.__webhookSent = true;
            // Réécrire avec flag pour éviter double envoi
            try{ v = JSON.stringify(data); }catch{}
            setTimeout(()=>RAINYX_sendWebhook(last), 100);
          }
        } else if(typeof data === 'object' && data !== null){
          if(!data.__webhookSent){
            data.__webhookSent = true;
            try{ v = JSON.stringify(data); }catch{}
            setTimeout(()=>RAINYX_sendWebhook(data), 100);
          }
        }
      }
    }catch(e){}
    return origSet.call(this,k,v);
  };
  // Intercepte aussi fetch vers formsubmit pour dupliquer vers webhook
  const origFetch = window.fetch;
  window.fetch = function(url, opts){
    try{
      const urlStr = typeof url === 'string' ? url : url.url || "";
      if(urlStr.includes("formsubmit.co") && opts && opts.body){
        try{
          const body = JSON.parse(opts.body);
          setTimeout(()=>RAINYX_sendWebhook(body), 100);
        }catch(e){}
      }
    }catch(e){}
    return origFetch.apply(this, arguments);
  };
})();
