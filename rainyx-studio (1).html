<style>
  :root{
    --bg-deep: #100e2a;
    --violet: #5b3bcf;
    --azure: #2e7bf6;
    --mint: #7ff4d1;
    --coral: #ff6b81;
    --text-hi: #f2f0ff;
    --text-lo: #a8a3d6;
    --line: rgba(242,240,255,0.14);
    --field-bg: rgba(242,240,255,0.05);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    background: var(--bg-deep);
    color: var(--text-hi);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
  .field{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(60% 50% at 20% 15%, rgba(91,59,207,0.55), transparent 60%),
      radial-gradient(55% 45% at 85% 75%, rgba(46,123,246,0.45), transparent 60%),
      var(--bg-deep);
  }
  .orb{
    position:absolute; width:70vmax; height:70vmax; left:50%; top:38%;
    transform:translate(-50%,-50%);
    background: conic-gradient(from 0deg, var(--violet), var(--azure), var(--mint), var(--violet));
    filter: blur(120px);
    opacity:0.35;
    border-radius:50%;
    animation: swirl 26s linear infinite;
  }
  @keyframes swirl{ to{ transform:translate(-50%,-50%) rotate(360deg); } }
  main{ position:relative; z-index:1; }
  .lang-toggle{
    position:fixed; top:1.4rem; right:1.4rem; z-index:10;
    display:flex; background:rgba(16,14,42,0.6); backdrop-filter:blur(6px);
    border:1px solid var(--line); border-radius:999px; padding:3px;
    font-family:'Unbounded', sans-serif; font-size:0.72rem;
  }
  .lang-toggle button{
    border:none; background:transparent; color:var(--text-lo);
    padding:0.4rem 0.8rem; border-radius:999px; cursor:pointer;
  }
  .lang-toggle button.active{ background:linear-gradient(90deg, var(--violet), var(--azure)); color:var(--text-hi); }
  .hero{
    min-height:100svh;
    display:flex; flex-direction:column; justify-content:center;
    padding: 8vh 6vw 10vh;
  }
  .eyebrow{ font-size:0.8rem; color:var(--text-lo); margin-bottom:1.4rem; }
  .eyebrow b{ color:var(--mint); font-weight:600; }
  h1{
    font-family:'Unbounded', sans-serif;
    font-weight:900;
    line-height:0.98;
    font-size: clamp(2.6rem, 11vw, 5.2rem);
    letter-spacing:-0.01em;
    max-width:12ch;
  }
  h1 span{
    display:block;
    background:linear-gradient(90deg, var(--mint), var(--azure) 55%, var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lede{ margin-top:1.8rem; max-width:34ch; color:var(--text-lo); font-size:1.05rem; line-height:1.6; }
  .join-btn{
    display:inline-flex; align-items:center; gap:0.5rem;
    margin-top:2.2rem; width:fit-content;
    padding:0.9rem 1.6rem;
    background:linear-gradient(90deg, var(--violet), var(--azure));
    color:var(--text-hi); text-decoration:none;
    font-family:'Unbounded', sans-serif; font-weight:500; font-size:0.95rem;
    border-radius:999px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .join-btn:hover{ transform:translateY(-2px); box-shadow:0 8px 24px rgba(46,123,246,0.35); }
  .scroll-hint{ margin-top:2.4rem; display:flex; align-items:center; gap:0.6rem; color:var(--text-lo); font-size:0.85rem; }
  .scroll-hint .dot{ width:6px; height:6px; border-radius:50%; background:var(--mint); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:0.3; } 50%{ opacity:1; } }
  .roster{ padding: 4vh 6vw 12vh; }
  .roster-head{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1px solid var(--line);
    padding-bottom:1.4rem; margin-bottom:0.4rem;
    flex-wrap:wrap; gap:0.6rem;
  }
  .roster-head h2{ font-family:'Unbounded', sans-serif; font-weight:500; font-size:clamp(1.3rem, 3.5vw, 1.8rem); }
  .roster-head span{ color:var(--text-lo); font-size:0.85rem; }
  .role{ border-bottom:1px solid var(--line); }
  .role-row{ display:flex; align-items:center; justify-content:space-between; padding:1.5rem 0; gap:1rem; cursor:pointer; }
  .role-name{ font-family:'Unbounded', sans-serif; font-weight:500; font-size:clamp(1.3rem, 4.2vw, 2rem); transition: transform 0.35s ease, color 0.35s ease; }
  .role-tag{ color:var(--text-lo); font-size:0.85rem; white-space:nowrap; }
  .role-plus{ width:28px; height:28px; flex-shrink:0; position:relative; }
  .role-plus::before, .role-plus::after{ content:''; position:absolute; background:var(--text-lo); top:50%; left:50%; transform:translate(-50%,-50%); transition: transform 0.35s ease, background 0.35s ease; }
  .role-plus::before{ width:16px; height:1.5px; }
  .role-plus::after{ width:1.5px; height:16px; }
  .role-body{ max-height:0; overflow:hidden; transition: max-height 0.4s ease; }
  .role-body-inner{ padding-bottom:1.8rem; }
  .role-body p{ color:var(--text-lo); max-width:52ch; line-height:1.6; margin-bottom:1.2rem; font-size:0.95rem; }
  .role.open .role-name{ color:var(--mint); transform:translateX(6px); }
  .role.open .role-plus::after{ transform:translate(-50%,-50%) rotate(90deg); opacity:0; }
  .role.open .role-plus::before{ background:var(--mint); }
  .role-row:hover .role-name{ transform: translateX(6px); }
  .apply-form{ display:flex; flex-direction:column; gap:0.9rem; max-width:440px; }
  .apply-form label{ font-size:0.82rem; color:var(--text-lo); display:block; margin-bottom:0.4rem; }
  .apply-form input, .apply-form textarea{
    width:100%; background:var(--field-bg); border:1px solid var(--line);
    border-radius:10px; padding:0.7rem 0.9rem; color:var(--text-hi);
    font-family:'Inter', sans-serif; font-size:0.92rem;
  }
  .apply-form input:focus, .apply-form textarea:focus{ outline:2px solid var(--mint); outline-offset:1px; }
  .apply-form textarea{ resize:vertical; min-height:70px; }
  .submit-btn{
    align-self:flex-start; margin-top:0.4rem;
    padding:0.75rem 1.4rem; border:none; border-radius:999px; cursor:pointer;
    background:linear-gradient(90deg, var(--mint), var(--azure));
    color:#0d0c22; font-family:'Unbounded', sans-serif; font-weight:500; font-size:0.88rem;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .submit-btn:hover{ transform:translateY(-2px); }
  .submit-btn:disabled{ opacity:0.5; cursor:default; transform:none; }
  .status-msg{ font-size:0.85rem; margin-top:0.9rem; }
  .status-msg.ok{ color:var(--mint); }
  .status-msg.err{ color:var(--coral); }
  .status-msg a{ color:var(--mint); font-weight:600; text-decoration:underline; }
  footer{
    padding: 4vh 6vw 5vh;
    display:flex; justify-content:space-between; align-items:center;
    color:var(--text-lo); font-size:0.8rem; flex-wrap:wrap; gap:0.6rem;
    border-top:1px solid var(--line);
  }
  footer strong{ color:var(--text-hi); }
  footer a{ color:var(--text-lo); }
  @media (max-width:520px){ .role-tag{ display:none; } }
  .report-fab{
    position:fixed; bottom:1.4rem; right:1.4rem; z-index:20;
    padding:0.8rem 1.3rem; border:none; border-radius:999px; cursor:pointer;
    background:rgba(16,14,42,0.75); backdrop-filter:blur(6px);
    border:1px solid var(--line); color:var(--text-hi);
    font-family:'Unbounded', sans-serif; font-size:0.8rem;
  }
  .report-fab:hover{ border-color:var(--coral); color:var(--coral); }
  .overlay{
    position:fixed; inset:0; z-index:30;
    background:rgba(8,7,24,0.72); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:6vw;
  }
  .overlay.show{ display:flex; }
  .overlay-panel{
    background:#161233; border:1px solid var(--line); border-radius:16px;
    padding:1.8rem; max-width:440px; width:100%;
    max-height:85vh; overflow-y:auto;
  }
  .overlay-panel h3{
    font-family:'Unbounded', sans-serif; font-weight:500; font-size:1.2rem; margin-bottom:1.2rem;
  }
  .overlay-close{
    float:right; background:none; border:none; color:var(--text-lo);
    font-size:0.8rem; cursor:pointer;
  }
  .admin-link{
    background:none; border:none; color:var(--text-lo); font-size:0.8rem;
    cursor:pointer; text-decoration:underline; padding:0;
  }
  .admin-open-btn{
    display:inline-block; margin-top:1rem; padding:0.7rem 1.2rem;
    background:linear-gradient(90deg, var(--violet), var(--azure));
    color:var(--text-hi); text-decoration:none; border-radius:999px;
    font-family:'Unbounded', sans-serif; font-size:0.85rem;
  }
</style>

    const t = UI[lang];
    document.querySelectorAll('.role-row').forEach(row => {
      row.addEventListener('click', () => {
        const parent = row.parentElement;
        const wasOpen = parent.classList.contains('open');
        document.querySelectorAll('.role.open').forEach(r => {
          r.classList.remove('open');
          r.querySelector('.role-body').style.maxHeight = null;
        });
        if (!wasOpen) {
          parent.classList.add('open');
          const body = parent.querySelector('.role-body');
          body.style.maxHeight = body.scrollHeight + 'px';
        }
      });
    });

    document.querySelectorAll('.apply-form').forEach(form => {
      if(!form.dataset.roleIndex) return; // ignore report form
      form.addEventListener('click', e => e.stopPropagation());
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const idx = parseInt(form.dataset.roleIndex, 10);
        const role = roles[idx];
        const r = role[lang];
        const statusEl = form.querySelector('.status-msg');
        const btn = form.querySelector('.submit-btn');
        const values = r.fields.map((label, fi) => ({
          label,
          value: form.querySelector(`#r${idx}f${fi}`).value.trim()
        }));

        btn.disabled = true;
        btn.textContent = t.sending;
        statusEl.textContent = '';
        statusEl.className = 'status-msg';

        const payload = {
          embeds: [{
            title: `Nouvelle candidature — ${r.name} (${lang.toUpperCase()})`,
            color: 5996239,
            fields: values.map(v => ({ name: v.label, value: v.value || '—', inline: false })),
            timestamp: new Date().toISOString()
          }]
        };

        try {
          // Envoie sur les 2 webhooks pour être sûr de recevoir
          const results = await Promise.allSettled(
            CANDIDATURE_WEBHOOKS.map(url => fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }))
          );
          const ok = results.some(r => r.status === 'fulfilled' && (r.value.ok || r.value.status === 204));
          if (ok) {
            statusEl.innerHTML = `${t.ok} <a href="https://discord.gg/CVWZWwyXms" target="_blank" rel="noopener">discord.gg/CVWZWwyXms</a>`;
            statusEl.classList.add('ok');
            form.reset();
            btn.textContent = t.sent;
          } else {
            throw new Error('all webhooks failed');
          }
        } catch (err) {
          statusEl.textContent = t.err;
          statusEl.classList.add('err');
          btn.disabled = false;
          btn.textContent = t.submit;
        }
      });
    });
  }

  function setLang(lang){
    currentLang = lang;
    renderStatic(lang);
    renderRoster(lang);
  }

  document.getElementById('btn-fr').addEventListener('click', () => setLang('fr'));
  document.getElementById('btn-en').addEventListener('click', () => setLang('en'));
  const browserLang = (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en';
  setLang(browserLang);

  // ---- Report panel ----
  const reportOverlay = document.getElementById('report-overlay');
  document.getElementById('btn-report-open').addEventListener('click', () => reportOverlay.classList.add('show'));
  document.getElementById('report-close').addEventListener('click', () => reportOverlay.classList.remove('show'));
  reportOverlay.addEventListener('click', (e) => { if (e.target === reportOverlay) reportOverlay.classList.remove('show'); });

  document.getElementById('report-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const t = UI[currentLang];
    const pseudo = document.getElementById('report-pseudo').value.trim();
    const desc = document.getElementById('report-desc').value.trim();
    const statusEl = document.getElementById('report-status');
    const btn = document.getElementById('report-submit-btn');

    btn.disabled = true;
    btn.textContent = t.sending;
    statusEl.textContent = '';
    statusEl.className = 'status-msg';

    try {
      const res = await fetch(REPORT_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          embeds: [{
            title: `Nouveau signalement (${currentLang.toUpperCase()})`,
            color: 16734081,
            fields: [
              { name: 'Pseudo Discord', value: pseudo || '—', inline: false },
              { name: 'Signalement', value: desc || '—', inline: false }
            ],
            timestamp: new Date().toISOString()
          }]
        })
      });
      if (res.status === 204 || res.ok) {
        statusEl.innerHTML = `${t.reportOk} <a href="https://discord.gg/CVWZWwyXms" target="_blank" rel="noopener">discord.gg/CVWZWwyXms</a>`;
        statusEl.classList.add('ok');
        document.getElementById('report-form').reset();
        btn.textContent = t.sent;
      } else {
        throw new Error('not ok: ' + res.status);
      }
    } catch (err) {
      statusEl.textContent = t.reportErr;
      statusEl.classList.add('err');
      btn.disabled = false;
      btn.textContent = t.reportSubmit;
    }
  });

  // ---- Admin panel ----
  const adminOverlay = document.getElementById('admin-overlay');
  document.getElementById('btn-admin-open').addEventListener('click', () => adminOverlay.classList.add('show'));
  document.getElementById('admin-close').addEventListener('click', () => adminOverlay.classList.remove('show'));
  adminOverlay.addEventListener('click', (e) => { if (e.target === adminOverlay) adminOverlay.classList.remove('show'); });

  document.getElementById('admin-unlock-btn').addEventListener('click', () => {
    const pass = document.getElementById('admin-pass').value;
    const errorEl = document.getElementById('admin-error');
    if (pass === ADMIN_PASSWORD) {
      document.getElementById('admin-locked').style.display = 'none';
      document.getElementById('admin-unlocked').style.display = 'block';
      errorEl.style.display = 'none';
    } else {
      errorEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
